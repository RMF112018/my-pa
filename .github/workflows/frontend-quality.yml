name: frontend-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: frontend / classify
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.classify.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # F023. The comparison uses the event's own immutable identities.
          # Comparing a fetched `origin/main` to `HEAD` was wrong for a push to
          # `main`: after the push those are the same commit, the diff is empty
          # and every frontend gate classified itself away on exactly the
          # integration event that most needed them.
          #
          # Anything the comparison cannot establish -- a zero `before` (first
          # push or a new branch), a force-push whose `before` is no longer an
          # ancestor, a shallow history, a missing object -- falls back to
          # treating the change as applicable. Running the suite unnecessarily
          # costs minutes; skipping it silently costs the gate.
          changed=""
          resolved="false"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null \
               && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null \
               && base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}" 2>/dev/null)"; then
              changed="$(git diff --name-only "${base}" "${PR_HEAD_SHA}")"
              resolved="true"
            fi
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${PUSH_BEFORE}" && "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
               && git cat-file -e "${PUSH_AFTER}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "${PUSH_BEFORE}" "${PUSH_AFTER}")"
              resolved="true"
            fi
          fi

          if [[ "${resolved}" != "true" ]]; then
            echo "applicability could not be resolved for event '${EVENT_NAME}'; failing open to applicable=true"
            echo "applicable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${changed}"
          if printf '%s\n' "${changed}" | grep -Eq '^(web/|\.github/workflows/frontend-quality\.yml$|src/my_pa/contracts/|src/my_pa/application/capabilities\.py|src/my_pa/application/(authorization|commands|service|constraint_management|constraints|constraint_settings)\.py$|tests/contract/|src/my_pa/.*/webauthn|src/my_pa/application/webauthn|src/my_pa/adapters/http/webauthn|src/my_pa/domain/identity/webauthn|src/my_pa/application/session_service|src/my_pa/adapters/http/auth_sessions|src/my_pa/bootstrap/settings.py|src/my_pa/bootstrap/gateway.py|src/my_pa/adapters/http/app.py|src/my_pa/adapters/mcp/(server|tools)\.py$|apps/gateway.py|pyproject.toml|web/package-lock.json|src/my_pa/application/goodnotes|src/my_pa/application/goodnotes_|src/my_pa/domain/goodnotes|src/my_pa/infrastructure/persistence/goodnotes|src/my_pa/domain/identity/operation\.py|src/my_pa/domain/identity/purpose\.py|src/my_pa/adapters/normalization\.py|migrations/versions/|src/my_pa/application/tasks\.py|src/my_pa/application/commitments\.py|src/my_pa/application/intelligence\.py|src/my_pa/application/relationships\.py|src/my_pa/application/identity_history\.py|src/my_pa/application/entity_|src/my_pa/infrastructure/persistence/canvas_workspace\.py|src/my_pa/infrastructure/persistence/task_management\.py|src/my_pa/infrastructure/persistence/entity\.py|src/my_pa/infrastructure/persistence/review\.py|src/my_pa/infrastructure/persistence/search\.py|src/my_pa/infrastructure/persistence/intelligence\.py|src/my_pa/infrastructure/persistence/capture\.py|src/my_pa/infrastructure/persistence/(constraints|capture_search|situation_repository|tables|unit_of_work)\.py$|src/my_pa/domain/project_controls/|src/my_pa/domain/capture/|src/my_pa/domain/situation/(situation|project_history)\.py$|src/my_pa/domain/task/|src/my_pa/domain/relationship/|src/my_pa/domain/search/|src/my_pa/domain/intelligence/|tests/situation/|tests/(architecture|capture|database|schema|security|unit)/.*(constraint|capture|project|task_management|frontend_ci_classify).*\.py$|tests/policy/test_application_authorization\.py$|tests/security/test_mcp_surface_controls\.py$|tests/unit/test_gateway_composition\.py$|ops/nas/|docs/decisions/ADR-012|docs/decisions/ADR-013|docs/plans/frontend-release-gates|src/my_pa/domain/identity/auth_grants\.py|src/my_pa/domain/identity/auth_state\.py|src/my_pa/domain/identity/user_account\.py|src/my_pa/infrastructure/persistence/auth_grants\.py|src/my_pa/infrastructure/persistence/auth_state\.py|src/my_pa/infrastructure/persistence/user_accounts\.py|src/my_pa/infrastructure/security/webauthn_ceremony\.py|apps/cli/auth\.py|tests/unit/test_auth_grants\.py|tests/unit/test_auth_state\.py|tests/unit/test_cli_auth\.py|tests/unit/test_user_account_identity\.py|tests/unit/test_webauthn_http\.py)'; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: frontend / static
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: frontend / unit
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  production-build:
    name: frontend / production-build
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  contract:
    name: frontend / contract
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit/test_webauthn_ceremony.py tests/unit/test_session_service_auth.py tests/unit/test_session_service_isolation.py tests/unit/test_auth_grants.py tests/unit/test_auth_state.py tests/unit/test_user_account_identity.py tests/unit/test_webauthn_http.py tests/unit/test_cli_auth.py tests/contract/test_bff_success_decoder_parity.py -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:contract
        working-directory: web

  security:
    name: frontend / security
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit/test_webauthn_ceremony.py tests/unit/test_session_service_auth.py tests/unit/test_session_service_isolation.py tests/unit/test_auth_grants.py tests/unit/test_auth_state.py tests/unit/test_user_account_identity.py tests/unit/test_webauthn_http.py tests/unit/test_cli_auth.py -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vitest run src/lib/http/mutation-admission.test.ts src/lib/http/origin.test.ts src/lib/http/mutation-route-manifest.test.ts src/lib/http/security-headers.test.ts src/lib/http/safe-href.test.ts
        working-directory: web

  e2e-critical:
    name: frontend / e2e-critical
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run curated WebAuthn and browser-security desktop e2e
        env:
          MYPA_E2E_PYTHON: python
          MYPA_E2E_ADMIN_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/postgres
          MYPA_E2E_DATABASE_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/my_pa_wp13_e2e
        run: |
          set -euo pipefail
          # stack.sh requires MYPA_E2E_PYTHON to be an executable path (`-x`),
          # so resolve the setup-python interpreter rather than the bare name.
          python_bin="$(command -v python)"
          test -x "${python_bin}"
          MYPA_E2E_PYTHON="${python_bin}" npm run e2e -- e2e/webauthn.spec.ts e2e/auth-public.spec.ts e2e/browser-security.spec.ts e2e/work-mutations.spec.ts e2e/review-decisions.spec.ts e2e/journeys.spec.ts e2e/reports-contract.spec.ts e2e/people-contract.spec.ts e2e/intelligence-journey.spec.ts e2e/search-contract.spec.ts e2e/goodnotes.spec.ts e2e/canvas.spec.ts e2e/system.spec.ts e2e/diagnostics-visibility.spec.ts e2e/constraints-read-plane.spec.ts e2e/project-controls-settings.spec.ts --project=desktop

  accessibility:
    name: frontend / accessibility
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run desktop accessibility e2e
        env:
          MYPA_E2E_PYTHON: python
          MYPA_E2E_ADMIN_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/postgres
          MYPA_E2E_DATABASE_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/my_pa_wp13_e2e
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          test -x "${python_bin}"
          MYPA_E2E_PYTHON="${python_bin}" npm run e2e -- e2e/accessibility.spec.ts e2e/diagnostics-visibility.spec.ts --project=desktop

  responsive:
    name: frontend / responsive
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run desktop, tablet, mobile and Work reflow e2e
        env:
          MYPA_E2E_PYTHON: python
          MYPA_E2E_ADMIN_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/postgres
          MYPA_E2E_DATABASE_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/my_pa_wp13_e2e
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          test -x "${python_bin}"
          MYPA_E2E_PYTHON="${python_bin}" npm run e2e -- e2e/work-acceptance.spec.ts e2e/today-tasks.spec.ts e2e/journeys.spec.ts e2e/intelligence-journey.spec.ts e2e/constraints-read-plane.spec.ts --project=desktop --project=tablet --project=mobile

  pwa-offline:
    name: frontend / pwa-offline
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run Chromium desktop PWA/offline e2e (INTRODUCED / ADVISORY)
        env:
          MYPA_E2E_PYTHON: python
          MYPA_E2E_ADMIN_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/postgres
          MYPA_E2E_DATABASE_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/my_pa_wp13_e2e
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          test -x "${python_bin}"
          MYPA_E2E_PYTHON="${python_bin}" npm run e2e -- e2e/pwa.spec.ts e2e/offline.spec.ts --project=desktop

  browsers:
    name: frontend / browsers
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - name: Run Firefox/WebKit critical-path e2e (INTRODUCED / ADVISORY)
        env:
          MYPA_E2E_PYTHON: python
          MYPA_E2E_ADMIN_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/postgres
          MYPA_E2E_DATABASE_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/my_pa_wp13_e2e
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          test -x "${python_bin}"
          # Origin/CSRF plus Search BFF smoke. WebAuthn virtual authenticator is
          # Chromium CDP only (HARVEST_CANNOT_PROVE). Playwright WebKit is not Safari.
          MYPA_E2E_PYTHON="${python_bin}" npm run e2e -- e2e/browser-security.spec.ts e2e/search-contract.spec.ts --project=firefox --project=webkit
      - name: Run Work control geometry under Firefox/WebKit (INTRODUCED / ADVISORY)
        # Runs even when the step above fails. That step exercises unrelated
        # origin/CSRF and Search specs and has a known Firefox failure in
        # hideNextjsDevOverlay (page.addStyleTag blocked by CSP), which would
        # otherwise abort the job before this measurement ever executes -- as it
        # did on the first run of this lane. The geometry evidence must not be
        # contingent on an unrelated spec passing.
        if: always()
        env:
          MYPA_E2E_PYTHON: python
          MYPA_E2E_ADMIN_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/postgres
          MYPA_E2E_DATABASE_URL: postgresql+psycopg://my_pa:ci_throwaway_not_a_secret@localhost:5432/my_pa_wp13_e2e
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          test -x "${python_bin}"
          # WP-TUX-06 WebKit remediation. The shared Task Status <select> rendered
          # 22px tall in macOS WebKit because a default-appearance select resolves
          # the author min-height to its intrinsic height; it now carries a
          # definite height.
          #
          # READ THIS BEFORE TRUSTING A GREEN HERE. A pass in this step is NOT
          # evidence that the 22px defect is fixed. On a branch with the fix
          # removed, this lane measured Status at 130x44 (WebKit) and 122x44
          # (Firefox) and passed. The Linux builds of both engines used here
          # honour min-height on a native select -- macOS WebKit does NOT, which
          # is the whole reason the definite height exists -- and ui/select.tsx
          # already sets min-h-[var(--control-height)], 44px at default density,
          # so these runners render 44px either way. The 22px collapse did not
          # reproduce on any Linux runner. What this step does prove is
          # the absence of overflow, clipping and layout regressions at the
          # measured widths -- which is why it is kept.
          #
          # The ONLY blocking regression guard for the fix itself is the class
          # contract in task-status-control.test.tsx, running in "frontend /
          # unit". Do not read "frontend / responsive" as a second one: it runs
          # work-acceptance.spec.ts on the Chromium desktop/tablet/mobile
          # projects and does feed the required gate, but Chromium reports 44px
          # with the fix removed too, so it is blind to this defect exactly as
          # the lanes here are. What it gates is Chromium layout and behaviour,
          # not this control's height. ("frontend / e2e-critical" does not run
          # that spec at all.)
          # This step is ADVISORY because this whole job is continue-on-error.
          # Playwright WebKit is not Safari.
