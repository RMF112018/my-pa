name: frontend-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: frontend / classify
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.classify.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(web/|src/my_pa/.*/webauthn|src/my_pa/application/webauthn|src/my_pa/adapters/http/webauthn|src/my_pa/domain/identity/webauthn|pyproject.toml|web/package-lock.json)'; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: frontend / static
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: frontend / unit
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  production-build:
    name: frontend / production-build
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  contract:
    name: frontend / contract
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit/test_webauthn_ceremony.py -q

  security:
    name: frontend / security
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit/test_webauthn_ceremony.py -q

  e2e-critical:
    name: frontend / e2e-critical
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run e2e -- e2e/webauthn.spec.ts
        continue-on-error: true

  required:
    name: frontend / required
    needs: [classify, static, unit, production-build, contract, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          APPLICABLE: ${{ needs.classify.outputs.applicable }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.production-build.result }}
          CONTRACT: ${{ needs.contract.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          if [[ "${APPLICABLE}" != "true" ]]; then
            echo "frontend / required = NOT_APPLICABLE"
            exit 0
          fi
          for result in "$STATIC" "$UNIT" "$BUILD" "$CONTRACT" "$SECURITY"; do
            if [[ "${result}" != "success" ]]; then
              echo "frontend / required failed: ${result}"
              exit 1
            fi
          done
          echo "frontend / required = PROMOTED_REQUIRED"
