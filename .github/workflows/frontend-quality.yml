        run: python ops/nas/validate-delivery-config.py

  required:
    name: frontend / required
    needs: [classify, static, unit, production-build, contract, security, e2e-critical, accessibility, responsive, delivery-config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          APPLICABLE: ${{ needs.classify.outputs.applicable }}
          CLASSIFY: ${{ needs.classify.result }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.production-build.result }}
          CONTRACT: ${{ needs.contract.result }}
          SECURITY: ${{ needs.security.result }}
          E2E: ${{ needs.e2e-critical.result }}
          A11Y: ${{ needs.accessibility.result }}
          RESPONSIVE: ${{ needs.responsive.result }}
          DELIVERY: ${{ needs.delivery-config.result }}
        run: |
          set -euo pipefail
          # F022. `!= "true" -> exit 0` meant that anything other than an exact
          # `true` passed this gate, including the empty string a skipped or
          # failed classifier produces. A classifier that crashed therefore
          # reported the blocking check green. Applicability is now a closed
          # vocabulary, the classifier's own result is required, and an
          # unresolved or malformed value fails.
          if [[ "${CLASSIFY}" != "success" ]]; then
            echo "frontend / required failed: classifier result was '${CLASSIFY}'"
            exit 1
          fi
          case "${APPLICABLE}" in
            true) ;;
            false)
              echo "frontend / required = NOT_APPLICABLE"
              exit 0
              ;;
            *)
              echo "frontend / required failed: applicability was '${APPLICABLE}', expected 'true' or 'false'"
              exit 1
              ;;
          esac
          for result in "$STATIC" "$UNIT" "$BUILD" "$CONTRACT" "$SECURITY" "$E2E" "$A11Y" "$RESPONSIVE" "$DELIVERY"; do
            if [[ "${result}" != "success" ]]; then
              echo "frontend / required failed: ${result}"
              exit 1
            fi
          done
          echo "frontend / required = PROMOTED_REQUIRED"
