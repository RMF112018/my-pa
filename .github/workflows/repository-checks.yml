    # Per-shard budget: measured locally on 2026-10-20 (S2 head, PostgreSQL
    # 15), the five weight-balanced shards took 7.6-9.5 minutes each including
    # collection, about 33 minutes of tests in all. The single job exceeded 60
    # minutes on CI (PostgreSQL 17), so CI is at least about 1.7x local; at
