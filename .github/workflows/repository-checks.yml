name: repository-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `validate` is three jobs. On PR #337 (run 39283086971) the single 60-minute
  # FAST job was cancelled by its timeout with no test failed, and S3 adds about
  # a thousand FAST tests. The operator granted sharding authority on
  # 2026-10-20 ("Shard FAST + migration-edge"); coverage reduction is still not
  # authorized, and none is made:
  #
  # - `validate-static` runs every non-pytest step of the former job exactly
  #   once (document/configuration validation, applicability, install, import
  #   smoke, ruff, mypy, governance-candidate packaging) plus the partition
  #   proof: `python -m tests.ci_shard verify` collects each sharded selection
  #   unsharded and once per shard and fails unless the shards are pairwise
  #   disjoint and their union is exactly the unsharded selection.
  # - `validate-fast` runs the unchanged FAST `-m` expression as deterministic
  #   file-level shards (`tests/ci_shard.py`), one matrix leg per shard. The
  #   matrix size, the `/COUNT` in `CI_SHARD` and the verify step are pinned to
  #   each other by `tests/architecture/test_ci_shards.py`.
  # - `validate` is the required-check compatible aggregator, like
  #   `database-tier`: it fails unless every needed result is exactly `success`
  #   (failure, cancelled and skipped all fail).
  #
  # Per-shard budget: measured locally on 2026-10-20 (S2 head), each of the
  # three FAST shards took 9.9-10.4 minutes including its roughly 2-minute
  # collection. One file alone
  # (`test_every_capability_reaching_a_memory_row_is_declared.py`, about 7
  # minutes) bounds any file-level shard from below. CI has run 1.5-1.8x
  # local, so about 16-19 minutes of pytest per leg is expected against a
  # 35-minute timeout. Measurement headroom, not a performance SLA.
  validate-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate repository documents and configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          errors = []
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for target in link_pattern.findall(text):
                  target = target.strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#", 1)[0]
                  if not clean:
                      continue
                  resolved = (root / clean.lstrip("/")) if clean.startswith("/") else (path.parent / clean)
                  if not resolved.resolve().exists():
                      errors.append(f"{path}: missing relative link {target}")

          required = [
              root / "AGENTS.md",
              root / "CONTRIBUTING.md",
              root / "SECURITY.md",
              root / ".github" / "pull_request_template.md",
              root / ".github" / "ISSUE_TEMPLATE" / "bounded-change.yml",
          ]
          for path in required:
              if not path.exists():
                  errors.append(f"missing required governance path: {path.relative_to(root)}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY

          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true); puts "validated #{f}" }' \
            .github/ISSUE_TEMPLATE/bounded-change.yml \
            .github/dependabot.yml

      - name: Check Python FAST applicability
        id: fast
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; governance/configuration validation is the applicable gate."
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Install Python FAST dependencies
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke-test Python FAST imports
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import tomllib
          from pathlib import Path

          from my_pa.adapters.mcp.server import _answer
          from my_pa.application.service import ApplicationService

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"package_name={project['project']['name']}")
          print(f"package_version={project['project']['version']}")
          print(
              "invoke="
              f"{ApplicationService.invoke.__module__}.{ApplicationService.invoke.__qualname__}"
          )
          print(f"invoke_file={inspect.getfile(ApplicationService)}")
          print(f"answer={_answer.__module__}.{_answer.__qualname__}")
          print(f"answer_file={inspect.getfile(_answer)}")
          PY

      - name: Lint and format-check Python FAST tier
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type-check Python FAST tier
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          # `mypy` with no path argument, deliberately: an explicit target
          # overrides `[tool.mypy] files` in `pyproject.toml`. Measured at
          # `bcdbf6d`: `mypy src` checked 93 files and a bare `mypy` checked
          # 109, so the 16 in `apps/` and `migrations/` were type-checked by
          # nothing in CI. Proven with a plant: a deliberate `-> str`
          # returning `int` in `apps/` left `mypy src` reporting "Success: no
          # issues found in 93 source files", and the same plant in
          # `migrations/env.py` did too, while a bare `mypy` caught both.
          # Both invocations are bare now, so they agree by construction
          # rather than by a number that has to be maintained. `D-64`.
          python -m mypy

      - name: Prove the CI test shards partition their selections
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          # Collection only: no test runs here and no database is needed to
          # collect the migration selection. Each command collects unsharded
          # and once per shard, concurrently, and compares node-ID sets.
          python -m tests.ci_shard verify --lane fast --shards 3 -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery"
          python -m tests.ci_shard verify --lane migration --shards 5 -m "migration_edge or migration"

      - name: Package governance candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-candidate-${{ github.sha }}
          path: |
            .ai/project-sources/00_AEOS_MASTER_INDEX.md
            .github/CODEOWNERS
            .github/ISSUE_TEMPLATE/bounded-change.yml
            .github/dependabot.yml
            .github/pull_request_template.md
            .github/workflows/repository-checks.yml
            AGENTS.md
            AI_OPERATING_MANUAL.md
            CLAUDE.md
            CONTRIBUTING.md
            SECURITY.md
            docs/00_REPOSITORY_SOURCE_INDEX.md
            docs/governance/GOVERNANCE-AUDIT-MYPA-MCV-20260730.md
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  validate-fast:
    # One leg per FAST shard; see the comment above `validate-static`. Each leg
    # repeats only what running pytest needs: checkout identity, the
    # applicability check (so a tree without `pyproject.toml` passes here
    # exactly as the single job did) and the install. The failure-annotation
    # ledger and `--durations=50` evidence are per leg.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check Python FAST applicability
        id: fast
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; governance/configuration validation is the applicable gate."
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Install Python FAST dependencies
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test Python FAST tier
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}/3
        run: |
          [[ "${GITHUB_ACTIONS-}" == true ]] || exit 1
          [[ -n "${RUNNER_TEMP-}" && "$RUNNER_TEMP" == /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || exit 1
          umask 077
          ledger_dir="$(mktemp -d "$RUNNER_TEMP/my-pa-fast-ledger.XXXXXXXX")" || exit 1
          ledger=""
          trap 'rm -f -- "$ledger"; rmdir -- "$ledger_dir"' EXIT
          ledger="$(mktemp "$ledger_dir/failures.XXXXXXXX")" || exit 1
          [[ -f "$ledger" && ! -L "$ledger" ]] || exit 1
          exec 9<"$ledger" || exit 1
          export CI_PYTEST_FAILURE_LEDGER="$ledger"
          status=0
          if python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery" --ci-shard "$CI_SHARD" --ci-shard-lane fast --durations=50 9<&-; then
            :
          else
            status=$?
          fi
          unset CI_PYTEST_FAILURE_LEDGER
          ledger_invalid=0
          if validated_annotations="$(python -c '
          import os
          import re
          import sys

          try:
              os.lseek(sys.stdin.fileno(), 0, os.SEEK_SET)
          except OSError:
              raise SystemExit(1)
          data = sys.stdin.buffer.read(10 * 1024 + 1)
          pattern = re.compile(
              rb"::error title=pytest failed::phase=(setup|call|teardown|collection); "
              rb"nodeid=tests/([A-Za-z0-9_./:~-]|%[0-9A-F]{2})+"
          )
          if len(data) > 10 * 1024 or not data.isascii() or b"\x00" in data:
              raise SystemExit(1)
          if data and not data.endswith(b"\n"):
              raise SystemExit(1)
          lines = data.split(b"\n")[:-1] if data else []
          if len(lines) > 10 or any(len(line) + 1 > 1024 or not pattern.fullmatch(line) for line in lines):
              raise SystemExit(1)
          sys.stdout.buffer.write(data)
          ' <&9)"; then
            :
          else
            ledger_invalid=1
          fi
          exec 9<&-
          if (( ledger_invalid != 0 )); then
            echo "::error title=pytest failed::phase=ledger; exitstatus=1"
            if (( status == 0 )); then exit 1; fi
          elif [[ -n "$validated_annotations" ]]; then
            if (( status == 0 )); then
              echo "::error title=pytest failed::phase=ledger; exitstatus=1"
              exit 1
            fi
            printf '%s\n' "$validated_annotations"
          fi
          if (( status != 0 )); then
            echo "::error title=pytest failed::phase=process; exitstatus=${status}"
            exit "$status"
          fi

  validate:
    # Required-check compatible aggregator over the split FAST gate. Does not
    # check out or run pytest. `always()` so a failed, cancelled or skipped
    # dependency is reported here as a failure rather than skipping the
    # aggregator, which a required check would read as passing.
    if: always()
    needs:
      - validate-static
      - validate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile validate lanes
        shell: bash
        env:
          STATIC: ${{ needs.validate-static.result }}
          FAST: ${{ needs.validate-fast.result }}
        run: |
          set -euo pipefail
          echo "validate-static=${STATIC}"
          echo "validate-fast=${FAST}"
          for result in "${STATIC}" "${FAST}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::validate lane failed: ${result}"
              exit 1
            fi
          done

  web-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci

      - name: Verify the web security boundary
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

  dependency-floor-fast:
    # Both this job and `validate-fast` run the whole FAST selection, so both
    # are sharded the same way, under the same operator authority (2026-10-20,
    # "Shard FAST + migration-edge"; no coverage reduction): the same `-m`
    # expression, the same file-level shards (`tests/ci_shard.py`), one matrix
    # leg per shard, aggregated by `dependency-floor` below. S1 passed this job
    # at 41 minutes unsharded; S3 adds about a thousand FAST tests, so leaving
    # it whole would put the floor gate back at the 60-minute timeout that
    # cancelled `validate` on PR #337.
    #
    # Every leg installs the floor, because every leg runs tests against it. The
    # floor import smoke test and the floor `mypy` run once, in shard 1, and
    # gate that leg; the matrix cannot drop shard 1 without
    # `tests/architecture/test_ci_shards.py` failing.
    #
    # `pyproject.toml` declares a lower bound for every runtime dependency, but
    # an ordinary install resolves the newest release, so the bound is an
    # assertion nothing checks. This job installs the declared minimum and runs
    # the suite against it, which is the only way the claim stays true.
    #
    # It is not hypothetical: a recursive PEP 695 type alias works on current
    # Pydantic and raises PydanticSchemaGenerationError at the declared floor,
    # where the suite fails during collection while the validate job stays
    # green. `src/my_pa/contracts/v1/envelope.py` avoids that form for this
    # reason, and this job is what keeps that reason true.
    runs-on: ubuntu-latest
    # Per-shard budget, as for `validate-fast`: the heaviest FAST shard is
    # expected at about 16-19 minutes of pytest on CI (S1 ran this job whole in
    # 41 minutes). Measurement headroom, not an SLA.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the declared minimum runtime dependencies
        id: floor
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; no dependency floor to verify."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

          python - <<'PY'
          import inspect
          import tomllib
          from pathlib import Path

          from my_pa.adapters.mcp.server import _answer
          from my_pa.application.service import ApplicationService

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"package_name={project['project']['name']}")
          print(f"package_version={project['project']['version']}")
          print(
              "invoke="
              f"{ApplicationService.invoke.__module__}.{ApplicationService.invoke.__qualname__}"
          )
          print(f"invoke_file={inspect.getfile(ApplicationService)}")
          print(f"answer={_answer.__module__}.{_answer.__qualname__}")
          print(f"answer_file={inspect.getfile(_answer)}")
          PY

          # Derive the pins from the declaration rather than restating them, and
          # require a floor for every runtime dependency.
          #
          # What the code below does. It parses each dependency with
          # `packaging` rather than a regex, so the whole specifier set is
          # available rather than whichever clause a pattern matched first.
          # Among the clauses that name an exact lower point (`>=`, `==`, `~=`)
          # it takes the greatest, comparing `Version` objects rather than
          # text. It then asks the specifier set whether that candidate
          # satisfies it, and reports the dependency instead of pinning it when
          # the answer is no -- the case for `pkg>=2.7,>3.0`, `pkg>=1.0,!=1.0`
          # and `pkg>=1.0,==1.2.*`. Finally it re-emits any extras alongside
          # the name. A reported dependency fails the job.
          #
          # Why re-emitting the extras is here at all. `Requirement.name` drops
          # them, so from the day this job was written until 2026-09-19 it
          # turned `psycopg[binary]>=3.2` into `psycopg==3.2`. `psycopg-binary`
          # is a separate distribution, and the pin never named it, so nothing
          # downgraded it. `pip check` reported nothing either, because
          # `psycopg-binary` declares no dependency on `psycopg` for it to
          # contradict. The pin now names the extra, so pip resolves it; what
          # a given extra then constrains is that extra's own business, and
          # differs between `psycopg[binary]` and `PyJWT[crypto]`.
          PINS="$(python -c '
          import sys, tomllib
          from packaging.requirements import Requirement
          from packaging.version import InvalidVersion, Version

          specs = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          pins, undetermined = [], []
          for spec in specs:
              requirement = Requirement(spec)
              lowers = []
              for clause in requirement.specifier:
                  if clause.operator not in (">=", "==", "~="):
                      continue
                  try:
                      lowers.append((Version(clause.version), clause.version))
                  except InvalidVersion:
                      continue
              lower = max(lowers)[1] if lowers else None
              if lower is None or not requirement.specifier.contains(lower, prereleases=True):
                  undetermined.append(spec)
              else:
                  extras = ",".join(sorted(requirement.extras))
                  name = requirement.name + (f"[{extras}]" if extras else "")
                  pins.append(f"{name}=={lower}")

          if undetermined:
              print(
                  "no lower bound declared for: " + ", ".join(undetermined),
                  file=sys.stderr,
              )
              sys.exit(1)
          print(" ".join(pins))
          ')"

          if [[ -z "$PINS" ]]; then
            echo "::error::No runtime dependency declares a lower bound to verify."
            exit 1
          fi

          echo "declared floor: $PINS"
          # `$PINS` stays unquoted so the shell splits it into one argument per
          # pin. Unquoted expansion also globs, and a pin carrying extras
          # contains `[...]`, which is glob syntax -- `[binary]` is a character
          # class. The pattern is the whole word. `set -f` disables pathname
          # expansion for the install and `set +f` restores it; word splitting
          # is unaffected by either.
          set -f
          # shellcheck disable=SC2086
          python -m pip install $PINS
          set +f

          # pip exits 0 after a forced downgrade even when it prints a conflict,
          # so ask explicitly. Without this a dev dependency that outgrew the
          # runtime floor would surface as a confusing floor failure.
          python -m pip check

          python -m pip list | grep -Ei '^(pydantic|my-pa) '
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Smoke-test contracts at the declared floor
        if: steps.floor.outputs.applicable == 'true' && matrix.shard == 1
        shell: bash
        run: |
          # Import the contracts, not just the package root: `my_pa/__init__.py`
          # touches no Pydantic model, so importing it alone would succeed even
          # on a build that cannot construct a schema at the floor.
          python -c "
          import my_pa
          from my_pa.contracts.v1 import ResponseEnvelope
          from my_pa.bootstrap.settings import SettingsError, load_settings
          assert ResponseEnvelope.model_fields
          # MY_PA_DATABASE_URL is required and has no default, so the settings
          # smoke check supplies one. The URL is unreachable on purpose: this
          # proves the model builds at the floor, and nothing here connects.
          url = 'postgresql+psycopg://someone@db.invalid:5432/somewhere'
          assert load_settings({'MY_PA_DATABASE_URL': url}).redaction_enabled
          # And that the requirement itself survives the floor build, because a
          # validator that silently stopped raising here would be a fail-open.
          try:
              load_settings({})
          except SettingsError:
              pass
          else:
              raise AssertionError('an absent MY_PA_DATABASE_URL was accepted')
          print('contracts import and build at floor OK, version', my_pa.__version__)
          "

      - name: Type-check at the declared floor
        if: steps.floor.outputs.applicable == 'true' && matrix.shard == 1
        shell: bash
        run: |
          # `mypy` with no path argument, deliberately: an explicit target
          # overrides `[tool.mypy] files` in `pyproject.toml`. Measured at
          # `bcdbf6d`: `mypy src` checked 93 files and a bare `mypy` checked
          # 109, so the 16 in `apps/` and `migrations/` were type-checked by
          # nothing in CI. Proven with a plant: a deliberate `-> str`
          # returning `int` in `apps/` left `mypy src` reporting "Success: no
          # issues found in 93 source files", and the same plant in
          # `migrations/env.py` did too, while a bare `mypy` caught both.
          # Both invocations are bare now, so they agree by construction
          # rather than by a number that has to be maintained. `D-64`.
          python -m mypy

      - name: Test Python FAST tier at the declared floor
        if: steps.floor.outputs.applicable == 'true'
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}/3
        run: |
          [[ "${GITHUB_ACTIONS-}" == true ]] || exit 1
          [[ -n "${RUNNER_TEMP-}" && "$RUNNER_TEMP" == /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || exit 1
          umask 077
          ledger_dir="$(mktemp -d "$RUNNER_TEMP/my-pa-fast-ledger.XXXXXXXX")" || exit 1
          ledger=""
          trap 'rm -f -- "$ledger"; rmdir -- "$ledger_dir"' EXIT
          ledger="$(mktemp "$ledger_dir/failures.XXXXXXXX")" || exit 1
          [[ -f "$ledger" && ! -L "$ledger" ]] || exit 1
          exec 9<"$ledger" || exit 1
          export CI_PYTEST_FAILURE_LEDGER="$ledger"
          status=0
          if python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery" --ci-shard "$CI_SHARD" --ci-shard-lane fast --durations=50 9<&-; then
            :
          else
            status=$?
          fi
          unset CI_PYTEST_FAILURE_LEDGER
          ledger_invalid=0
          if validated_annotations="$(python -c '
          import os
          import re
          import sys

          try:
              os.lseek(sys.stdin.fileno(), 0, os.SEEK_SET)
          except OSError:
              raise SystemExit(1)
          data = sys.stdin.buffer.read(10 * 1024 + 1)
          pattern = re.compile(
              rb"::error title=pytest failed::phase=(setup|call|teardown|collection); "
              rb"nodeid=tests/([A-Za-z0-9_./:~-]|%[0-9A-F]{2})+"
          )
          if len(data) > 10 * 1024 or not data.isascii() or b"\x00" in data:
              raise SystemExit(1)
          if data and not data.endswith(b"\n"):
              raise SystemExit(1)
          lines = data.split(b"\n")[:-1] if data else []
          if len(lines) > 10 or any(len(line) + 1 > 1024 or not pattern.fullmatch(line) for line in lines):
              raise SystemExit(1)
          sys.stdout.buffer.write(data)
          ' <&9)"; then
            :
          else
            ledger_invalid=1
          fi
          exec 9<&-
          if (( ledger_invalid != 0 )); then
            echo "::error title=pytest failed::phase=ledger; exitstatus=1"
            if (( status == 0 )); then exit 1; fi
          elif [[ -n "$validated_annotations" ]]; then
            if (( status == 0 )); then
              echo "::error title=pytest failed::phase=ledger; exitstatus=1"
              exit 1
            fi
            printf '%s\n' "$validated_annotations"
          fi
          if (( status != 0 )); then
            echo "::error title=pytest failed::phase=process; exitstatus=${status}"
            exit "$status"
          fi

