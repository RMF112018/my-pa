  validate:
    # Required-check compatible aggregator over the split FAST gate. Does not
    # check out or run pytest. `always()` so a failed, cancelled or skipped
    # dependency is reported here as a failure rather than skipping the
    # aggregator, which a required check would read as passing. `classify`
    # must be `success`; `validate-static` must be `success`; `validate-fast`
    # must be `success`, or `skipped` on a docs-only PR; `validate-docs` must
    # be `success` on a docs-only PR and `skipped` otherwise.
    if: always()
    needs:
      - classify
      - validate-static
      - validate-fast
      - validate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile validate lanes
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
          STATIC: ${{ needs.validate-static.result }}
          FAST: ${{ needs.validate-fast.result }}
          DOCS: ${{ needs.validate-docs.result }}
        run: |
          set -euo pipefail
          echo "classify=${CLASSIFY}"
          echo "docs_only=${DOCS_ONLY}"
          echo "event_name=${EVENT_NAME}"
          echo "validate-static=${STATIC}"
          echo "validate-fast=${FAST}"
          echo "validate-docs=${DOCS}"
          if [[ "${CLASSIFY}" != "success" ]]; then
            echo "::error::classify did not succeed: ${CLASSIFY}"
            exit 1
          fi
          docs_lane="false"
          if [[ "${EVENT_NAME}" == "pull_request" && "${DOCS_ONLY}" == "true" ]]; then
            docs_lane="true"
          fi
          for result in "${STATIC}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::validate lane failed: ${result}"
              exit 1
            fi
          done
          for result in "${FAST}"; do
            if [[ "${result}" == "skipped" && "${docs_lane}" == "true" ]]; then
              continue
            fi
            if [[ "${result}" != "success" ]]; then
              echo "::error::validate lane failed: ${result}"
              exit 1
            fi
          done
          expected_docs="skipped"
          if [[ "${docs_lane}" == "true" ]]; then
            expected_docs="success"
          fi
          if [[ "${DOCS}" != "${expected_docs}" ]]; then
            echo "::error::validate-docs is ${DOCS}, expected ${expected_docs}"
            exit 1
          fi

  web-security:
    # Skipped only on a docs-only PR (see `classify`).
