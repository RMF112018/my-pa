          )
          print(f"invoke_file={inspect.getfile(ApplicationService)}")
          print(f"answer={_answer.__module__}.{_answer.__qualname__}")
          print(f"answer_file={inspect.getfile(_answer)}")
          PY
      - name: Run recovery database tests
        shell: bash
        env:
          MY_PA_DATABASE_URL: postgresql+psycopg://my_pa@localhost:5432/my_pa_ci
          PGPASSWORD: ci_throwaway_not_a_secret
        run: python -m pytest -m recovery

  migration-empty-to-head:
    # Always on PR/push. Path filters must never drop this invariant.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
