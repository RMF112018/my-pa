        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_HEAD: ${{ needs.database-current-head.result }}
          RECOVERY: ${{ needs.database-recovery.result }}
          EMPTY_TO_HEAD: ${{ needs.migration-empty-to-head.result }}
          EDGE: ${{ needs.migration-edge.result }}
          E2E: ${{ needs.database-e2e.result }}
        run: |
          set -euo pipefail
          echo "classify=${CLASSIFY}"
          echo "docs_only=${DOCS_ONLY}"
          echo "event_name=${EVENT_NAME}"
          echo "database-current-head=${CURRENT_HEAD}"
          echo "database-recovery=${RECOVERY}"
          echo "migration-empty-to-head=${EMPTY_TO_HEAD}"
          echo "migration-edge=${EDGE}"
          echo "database-e2e=${E2E}"
          if [[ "${CLASSIFY}" != "success" ]]; then
            echo "::error::classify did not succeed: ${CLASSIFY}"
            exit 1
          fi
          docs_lane="false"
          if [[ "${EVENT_NAME}" == "pull_request" && "${DOCS_ONLY}" == "true" ]]; then
            docs_lane="true"
          fi
          for result in "${EDGE}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::database-tier lane failed: ${result}"
              exit 1
            fi
          done
          for result in "${CURRENT_HEAD}" "${RECOVERY}" "${EMPTY_TO_HEAD}" "${E2E}"; do
            if [[ "${result}" == "skipped" && "${docs_lane}" == "true" ]]; then
              continue
            fi
            if [[ "${result}" != "success" ]]; then
              echo "::error::database-tier lane failed: ${result}"
              exit 1
            fi
          done
