    timeout-minutes: 5
    steps:
      - name: Reconcile database-tier lanes
        shell: bash
        env:
          CURRENT_HEAD: ${{ needs.database-current-head.result }}
          RECOVERY: ${{ needs.database-recovery.result }}
          EMPTY_TO_HEAD: ${{ needs.migration-empty-to-head.result }}
          EDGE: ${{ needs.migration-edge.result }}
          E2E: ${{ needs.database-e2e.result }}
        run: |
          set -euo pipefail
          echo "database-current-head=${CURRENT_HEAD}"
          echo "database-recovery=${RECOVERY}"
          echo "migration-empty-to-head=${EMPTY_TO_HEAD}"
          echo "migration-edge=${EDGE}"
          echo "database-e2e=${E2E}"
          for result in "${CURRENT_HEAD}" "${RECOVERY}" "${EMPTY_TO_HEAD}" "${EDGE}" "${E2E}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::database-tier lane failed: ${result}"
              exit 1
            fi
          done
