  database-tier:
    # Required-check compatible aggregator. Does not check out or run pytest.
    # migration_historical has no tests on this tree and the repository has no
    # scheduled/release workflow appropriate to add one inside this change.
    # Historical compatibility remains a bounded follow-up, not a new job.
    if: always()
    needs:
      - database-current-head
      - database-recovery
      - migration-empty-to-head
      - migration-edge
      - database-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile database-tier lanes
        shell: bash
        env:
          CURRENT_HEAD: ${{ needs.database-current-head.result }}
          RECOVERY: ${{ needs.database-recovery.result }}
          EMPTY_TO_HEAD: ${{ needs.migration-empty-to-head.result }}
          EDGE: ${{ needs.migration-edge.result }}
          E2E: ${{ needs.database-e2e.result }}
        run: |
          set -euo pipefail
          echo "database-current-head=${CURRENT_HEAD}"
          echo "database-recovery=${RECOVERY}"
          echo "migration-empty-to-head=${EMPTY_TO_HEAD}"
          echo "migration-edge=${EDGE}"
          echo "database-e2e=${E2E}"
          for result in "${CURRENT_HEAD}" "${RECOVERY}" "${EMPTY_TO_HEAD}" "${EDGE}" "${E2E}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::database-tier lane failed: ${result}"
              exit 1
            fi
          done
