name: repository-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository documents and configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          errors = []
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for target in link_pattern.findall(text):
                  target = target.strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#", 1)[0]
                  if not clean:
                      continue
                  resolved = (root / clean.lstrip("/")) if clean.startswith("/") else (path.parent / clean)
                  if not resolved.resolve().exists():
                      errors.append(f"{path}: missing relative link {target}")

          required = [
              root / "AGENTS.md",
              root / "CONTRIBUTING.md",
              root / "SECURITY.md",
              root / ".github" / "pull_request_template.md",
              root / ".github" / "ISSUE_TEMPLATE" / "bounded-change.yml",
          ]
          for path in required:
              if not path.exists():
                  errors.append(f"missing required governance path: {path.relative_to(root)}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY

          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true); puts "validated #{f}" }' \
            .github/ISSUE_TEMPLATE/bounded-change.yml \
            .github/dependabot.yml

      - name: Run Python FAST tier when package configuration exists
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; governance/configuration validation is the applicable gate."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m ruff format --check .
          # `mypy` with no path argument, deliberately: an explicit target
          # overrides `[tool.mypy] files` in `pyproject.toml`. Measured at
          # `bcdbf6d`: `mypy src` checked 93 files and a bare `mypy` checked
          # 109, so the 16 in `apps/` and `migrations/` were type-checked by
          # nothing in CI. Proven with a plant: a deliberate `-> str`
          # returning `int` in `apps/` left `mypy src` reporting "Success: no
          # issues found in 93 source files", and the same plant in
          # `migrations/env.py` did too, while a bare `mypy` caught both.
          # Both invocations are bare now, so they agree by construction
          # rather than by a number that has to be maintained. `D-64`.
          python -m mypy
          python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery"

      - name: Package governance candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-candidate-${{ github.sha }}
          path: |
            .ai/project-sources/00_AEOS_MASTER_INDEX.md
            .github/CODEOWNERS
            .github/ISSUE_TEMPLATE/bounded-change.yml
            .github/dependabot.yml
            .github/pull_request_template.md
            .github/workflows/repository-checks.yml
            AGENTS.md
            AI_OPERATING_MANUAL.md
            CLAUDE.md
            CONTRIBUTING.md
            SECURITY.md
            docs/00_REPOSITORY_SOURCE_INDEX.md
            docs/governance/GOVERNANCE-AUDIT-MYPA-MCV-20260730.md
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  web-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci

      - name: Verify the web security boundary
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

  dependency-floor:
    # `pyproject.toml` declares a lower bound for every runtime dependency, but
    # an ordinary install resolves the newest release, so the bound is an
    # assertion nothing checks. This job installs the declared minimum and runs
    # the suite against it, which is the only way the claim stays true.
    #
    # It is not hypothetical: a recursive PEP 695 type alias works on current
    # Pydantic and raises PydanticSchemaGenerationError at the declared floor,
    # where the suite fails during collection while the validate job stays
    # green. `src/my_pa/contracts/v1/envelope.py` avoids that form for this
    # reason, and this job is what keeps that reason true.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the declared minimum runtime dependencies
        id: floor
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; no dependency floor to verify."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

          # Derive the pins from the declaration rather than restating them, and
          # require a floor for every runtime dependency. Parsing with
          # `packaging` rather than a regex matters: a hand-rolled pattern
          # silently drops `pkg[extra]>=1.2`, `pkg<3,>=2.7`, and `pkg~=1.2`,
          # which would leave a dependency untested with the job still green.
          PINS="$(python -c '
          import sys, tomllib
          from packaging.requirements import Requirement

          specs = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          pins, undetermined = [], []
          for spec in specs:
              requirement = Requirement(spec)
              lower = next(
                  (c.version for c in requirement.specifier if c.operator in (">=", "==", "~=")),
                  None,
              )
              if lower is None:
                  undetermined.append(spec)
              else:
                  pins.append(f"{requirement.name}=={lower}")

          if undetermined:
              print(
                  "no lower bound declared for: " + ", ".join(undetermined),
                  file=sys.stderr,
              )
              sys.exit(1)
          print(" ".join(pins))
          ')"

          if [[ -z "$PINS" ]]; then
            echo "::error::No runtime dependency declares a lower bound to verify."
            exit 1
          fi

          echo "declared floor: $PINS"
          # shellcheck disable=SC2086
          python -m pip install $PINS

          # pip exits 0 after a forced downgrade even when it prints a conflict,
          # so ask explicitly. Without this a dev dependency that outgrew the
          # runtime floor would surface as a confusing floor failure.
          python -m pip check

          python -m pip list | grep -Ei '^(pydantic|my-pa) '
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Type-check and test at the declared floor
        if: steps.floor.outputs.applicable == 'true'
        shell: bash
        run: |
          # Import the contracts, not just the package root: `my_pa/__init__.py`
          # touches no Pydantic model, so importing it alone would succeed even
          # on a build that cannot construct a schema at the floor.
          python -c "
          import my_pa
          from my_pa.contracts.v1 import ResponseEnvelope
          from my_pa.bootstrap.settings import SettingsError, load_settings
          assert ResponseEnvelope.model_fields
          # MY_PA_DATABASE_URL is required and has no default, so the settings
          # smoke check supplies one. The URL is unreachable on purpose: this
          # proves the model builds at the floor, and nothing here connects.
          url = 'postgresql+psycopg://someone@db.invalid:5432/somewhere'
          assert load_settings({'MY_PA_DATABASE_URL': url}).redaction_enabled
          # And that the requirement itself survives the floor build, because a
          # validator that silently stopped raising here would be a fail-open.
          try:
              load_settings({})
          except SettingsError:
              pass
          else:
              raise AssertionError('an absent MY_PA_DATABASE_URL was accepted')
          print('contracts import and build at floor OK, version', my_pa.__version__)
          "
          # `mypy` with no path argument, deliberately: an explicit target
          # overrides `[tool.mypy] files` in `pyproject.toml`. Measured at
          # `bcdbf6d`: `mypy src` checked 93 files and a bare `mypy` checked
          # 109, so the 16 in `apps/` and `migrations/` were type-checked by
          # nothing in CI. Proven with a plant: a deliberate `-> str`
          # returning `int` in `apps/` left `mypy src` reporting "Success: no
          # issues found in 93 source files", and the same plant in
          # `migrations/env.py` did too, while a bare `mypy` caught both.
          # Both invocations are bare now, so they agree by construction
          # rather than by a number that has to be maintained. `D-64`.
          python -m mypy
          python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery"

  database-tier:
    # The `validate` and `dependency-floor` jobs both deselect `-m database`,
    # and until now nothing supplied a server, so the tests covering the engine,
    # the Alembic chain from empty to head, the control plane, and the loader
    # had never run in CI at all. AGENTS.md section 7 puts focused
    # isolated-database integration tests in the PR gate when a change affects
    # persistence, and persistence is now most of the package.
    #
    # The service below is a throwaway cluster that lives and dies with the job.
    # It is not a route to the canonical local `my_pa` and must never become
    # one: the URL names `my_pa_ci`, and every test creates and drops its own
    # `my_pa_*_test` database off the `postgres` maintenance database, so even
    # the configured database is never written to.
    #
    # This job selects `database or recovery or e2e` (`D-46`, premise corrected
    # by `D-53`). The two FAST jobs above deselect every one of the three and
    # keep doing so; this is the only job that runs any of them.
    #
    # The reason first given for widening it was wrong, and is not repeated
    # here: it said recovery and e2e tests "would never run in CI". Recomputed
    # against the tree, `-m database` selects any test carrying the `database`
    # marker whatever else it also carries, and every `recovery`-marked test
    # carries both — `-m "recovery and not database"` collects 0. Those tests
    # already ran. Two reasons that do hold replace it:
    #
    #   1. `-m e2e` collected 0 before WP-4B3, so the marker was declared and
    #      unused, and `tests/end_to_end/test_vertical_slice.py` — acceptance
    #      criterion 7, the whole slice — would have run in no job at all had it
    #      not also happened to carry `database`.
    #   2. Today's safety is contingent on every future `recovery`/`e2e` test
    #      also carrying `database`, and nothing enforces that. A test that
    #      carried only `recovery` would be committed, collected by no job, and
    #      reported green. Selecting the markers directly removes the
    #      contingency rather than relying on it.
    #
    # `AGENTS.md` section 7 places recovery and idempotency tests in FULL, so
    # the markers carry meaning and stay on the tests; dropping them to make the
    # `-m database` selection sufficient would have destroyed the information
    # instead of acting on it. No new marker is introduced — one would need
    # `pyproject.toml` and both `-m` expressions above as well.
    runs-on: ubuntu-latest
    # Measured on run 31949638484 at head fc39292: the job-level 20-minute
    # timeout cancelled pytest at 20m17s while it was still executing, at 61%
    # of the suite. Linear extrapolation of that in-progress run is ~33 minutes
    # of wall time. Allow forty so checkout, install, and teardown still sit
    # outside an in-budget suite rather than pre-empting it.
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_pa
          # A throwaway credential for a container destroyed with the job, so it
          # is not a secret and does not belong in the secret store. It is
          # deliberately *not* the local development password: a workflow file
          # is readable by anyone who can read the repository, and a value that
          # also opened a developer's machine would be one.
          POSTGRES_PASSWORD: ci_throwaway_not_a_secret
          POSTGRES_DB: my_pa_ci
        ports:
          - 5432:5432
        # Steps start only once the server answers, so a test does not race the
        # container's own initialisation and fail as a connection error.
        options: >-
          --health-cmd "pg_isready --username my_pa --dbname my_pa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the database tier against the disposable service
        shell: bash
        env:
          # The URL carries no password, matching the settings contract and
          # `.env.example`: credentials stay out of connection strings and libpq
          # reads this one from PGPASSWORD.
          MY_PA_DATABASE_URL: postgresql+psycopg://my_pa@localhost:5432/my_pa_ci
          PGPASSWORD: ci_throwaway_not_a_secret
        run: python -m pytest -m "database or recovery or e2e"
