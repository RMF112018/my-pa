name: repository-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository documents and configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          errors = []
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for target in link_pattern.findall(text):
                  target = target.strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#", 1)[0]
                  if not clean:
                      continue
                  resolved = (root / clean.lstrip("/")) if clean.startswith("/") else (path.parent / clean)
                  if not resolved.resolve().exists():
                      errors.append(f"{path}: missing relative link {target}")

          required = [
              root / "AGENTS.md",
              root / "CONTRIBUTING.md",
              root / "SECURITY.md",
              root / ".github" / "pull_request_template.md",
              root / ".github" / "ISSUE_TEMPLATE" / "bounded-change.yml",
          ]
          for path in required:
              if not path.exists():
                  errors.append(f"missing required governance path: {path.relative_to(root)}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY

          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true); puts "validated #{f}" }' \
            .github/ISSUE_TEMPLATE/bounded-change.yml \
            .github/dependabot.yml

      - name: Run Python FAST tier when package configuration exists
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; governance/configuration validation is the applicable gate."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery"

      - name: Package governance candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-candidate-${{ github.sha }}
          path: |
            .ai/project-sources/00_AEOS_MASTER_INDEX.md
            .github/CODEOWNERS
            .github/ISSUE_TEMPLATE/bounded-change.yml
            .github/dependabot.yml
            .github/pull_request_template.md
            .github/workflows/repository-checks.yml
            AGENTS.md
            AI_OPERATING_MANUAL.md
            CLAUDE.md
            CONTRIBUTING.md
            SECURITY.md
            docs/00_REPOSITORY_SOURCE_INDEX.md
            docs/governance/GOVERNANCE-AUDIT-MYPA-MCV-20260730.md
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  dependency-floor:
    # `pyproject.toml` declares a lower bound for every runtime dependency, but
    # an ordinary install resolves the newest release, so the bound is an
    # assertion nothing checks. This job installs the declared minimum and runs
    # the suite against it, which is the only way the claim stays true.
    #
    # It is not hypothetical: a recursive PEP 695 type alias works on current
    # Pydantic and raises PydanticSchemaGenerationError at the declared floor,
    # where the suite fails during collection while the validate job stays
    # green. `src/my_pa/contracts/v1/envelope.py` avoids that form for this
    # reason, and this job is what keeps that reason true.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the declared minimum runtime dependencies
        id: floor
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; no dependency floor to verify."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

          # Derive the pins from the declaration rather than restating them, and
          # require a floor for every runtime dependency. Parsing with
          # `packaging` rather than a regex matters: a hand-rolled pattern
          # silently drops `pkg[extra]>=1.2`, `pkg<3,>=2.7`, and `pkg~=1.2`,
          # which would leave a dependency untested with the job still green.
          PINS="$(python -c '
          import sys, tomllib
          from packaging.requirements import Requirement

          specs = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          pins, undetermined = [], []
          for spec in specs:
              requirement = Requirement(spec)
              lower = next(
                  (c.version for c in requirement.specifier if c.operator in (">=", "==", "~=")),
                  None,
              )
              if lower is None:
                  undetermined.append(spec)
              else:
                  pins.append(f"{requirement.name}=={lower}")

          if undetermined:
              print(
                  "no lower bound declared for: " + ", ".join(undetermined),
                  file=sys.stderr,
              )
              sys.exit(1)
          print(" ".join(pins))
          ')"

          if [[ -z "$PINS" ]]; then
            echo "::error::No runtime dependency declares a lower bound to verify."
            exit 1
          fi

          echo "declared floor: $PINS"
          # shellcheck disable=SC2086
          python -m pip install $PINS

          # pip exits 0 after a forced downgrade even when it prints a conflict,
          # so ask explicitly. Without this a dev dependency that outgrew the
          # runtime floor would surface as a confusing floor failure.
          python -m pip check

          python -m pip list | grep -Ei '^(pydantic|my-pa) '
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Type-check and test at the declared floor
        if: steps.floor.outputs.applicable == 'true'
        shell: bash
        run: |
          # Import the contracts, not just the package root: `my_pa/__init__.py`
          # touches no Pydantic model, so importing it alone would succeed even
          # on a build that cannot construct a schema at the floor.
          python -c "
          import my_pa
          from my_pa.contracts.v1 import ResponseEnvelope
          from my_pa.bootstrap.settings import load_settings
          assert ResponseEnvelope.model_fields
          assert load_settings({}).redaction_enabled
          print('contracts import and build at floor OK, version', my_pa.__version__)
          "
          python -m mypy src
          python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery"
