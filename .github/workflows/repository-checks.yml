            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import inspect
          import tomllib
          from pathlib import Path
          from my_pa.adapters.mcp.server import _answer
          from my_pa.application.service import ApplicationService
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"package_name={project['project']['name']}")
          print(f"package_version={project['project']['version']}")
          print(
              "invoke="
              f"{ApplicationService.invoke.__module__}.{ApplicationService.invoke.__qualname__}"
          )
          print(f"invoke_file={inspect.getfile(ApplicationService)}")
          print(f"answer={_answer.__module__}.{_answer.__qualname__}")
          print(f"answer_file={inspect.getfile(_answer)}")
          PY
      - name: Run current-head database tests
        shell: bash
        env:
          MY_PA_DATABASE_URL: postgresql+psycopg://my_pa@localhost:5432/my_pa_ci
          PGPASSWORD: ci_throwaway_not_a_secret
          PYTEST_PROVISIONING_REPORT: "1"
        run: >-
          python -m pytest -m
          "(database_clone or database_transactional) and not recovery and not e2e
          and not migration_edge and not migration_empty_to_head and not migration"

