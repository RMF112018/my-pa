name: repository-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `classify` -- what this run must prove (2026-11-22, "speed up
  # repository-checks for PRs"; no test deleted, and no coverage reduced on
  # push to main or workflow_dispatch). The logic is `tests/ci_classify.py`
  # (standard library, run as a script) and is exercised case by case, without
  # `act`, by `tests/architecture/test_ci_shards.py`, which also pins every
  # `if:` and aggregator rule below to these outputs.
  #
  # - The diff is `git diff --name-status --no-renames` between the event's own
  #   immutable SHAs (`pull_request.base.sha`/`head.sha`, merge-base, full
  #   history), as `frontend-quality.yml` `classify` does; `--no-renames` makes
  #   a rename an `A` plus a `D`, so both sides are classified.
  # - The classifier executed is the merge-base's `tests/ci_classify.py`
  #   (`git show`), never the PR's own, so a PR cannot relax the classifier
  #   that classifies it; a change to the classifier is not docs-only and runs
  #   in full. Without a merge-base copy the workflow writes the full-run
  #   answer itself.
  # - Fail closed: a non-PR event, an unresolvable or empty diff, an unknown
  #   status letter, or any path that is absolute, has an empty/`.`/`..`
  #   segment, a backslash or git quoting gives `docs_only=false` and
  #   `shard_proof=true`, i.e. today's full run.
  # - `docs_only=true` iff the PR changes only paths under `docs/`, top-level
  #   `*.md`, or `*.md` under `ops/runbooks/`. Such a PR skips `validate-fast`,
  #   the advisory `validate-fast-xdist`,
  #   `dependency-floor-fast`, `web-security`, every database and migration
  #   job, and the partition proof; it still runs `validate-static` (document
  #   and configuration validation, ruff, mypy) and runs `validate-docs`, the
  #   test modules that read those paths.
  # - `shard_proof=true` unless the PR cannot change how `tests/ci_shard.py`
  #   partitions a selection; see the comment on that step in
  #   `validate-static`.
  # - A skippable job's condition is "not (PR and classify succeeded and
  #   docs_only == 'true')" under `!cancelled()`, so a failed `classify` runs
  #   everything rather than skipping it; on push and workflow_dispatch the
  #   event test alone keeps every job.
  # - The aggregators `validate`, `dependency-floor`, `migration-edge` and
  #   `database-tier` (the required-check compatible names) also need
  #   `classify`. Each fails unless `classify` is exactly `success`. A needed
  #   job may then be `skipped` only on a docs-only PR; otherwise the rule is
  #   unchanged (every needed result exactly `success`). `validate` also needs
  #   `validate-docs`: `success` on a docs-only PR, `skipped` otherwise.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      shard_proof: ${{ steps.classify.outputs.shard_proof }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Classify the change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          resolved="false"
          changed=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_BASE_SHA}" =~ ^[0-9a-f]{40}$ && "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] \
               && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null \
               && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null \
               && base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}" 2>/dev/null)" \
               && changed="$(git diff --name-status --no-renames "${base}" "${PR_HEAD_SHA}")" \
               && git show "${base}:tests/ci_classify.py" > "${RUNNER_TEMP}/ci_classify.py" 2>/dev/null; then
              resolved="true"
            fi
          fi
          printf '%s\n' "${changed}"
          if [[ "${resolved}" == "true" ]]; then
            # The merge-base's classifier, not the PR's: a PR cannot classify
            # itself with a classifier it changes (that change is not
            # docs-only, so the base classifier sends it to the full run).
            printf '%s\n' "${changed}" | python3 -I "${RUNNER_TEMP}/ci_classify.py" --event "${EVENT_NAME}" > "${RUNNER_TEMP}/classification"
          else
            # Not resolved (a push, workflow_dispatch, a missing object, or a
            # merge-base without the classifier): the full run, written here
            # rather than by any classifier the checked-out tree carries.
            echo "diff not resolved for event '${EVENT_NAME}'; classifying as a full run"
            printf 'docs_only=false\nshard_proof=true\n' > "${RUNNER_TEMP}/classification"
          fi
          cat "${RUNNER_TEMP}/classification"
          [[ "$(wc -l < "${RUNNER_TEMP}/classification")" -eq 2 ]]
          grep -Eqx 'docs_only=(true|false)' "${RUNNER_TEMP}/classification"
          grep -Eqx 'shard_proof=(true|false)' "${RUNNER_TEMP}/classification"
          cat "${RUNNER_TEMP}/classification" >> "$GITHUB_OUTPUT"

  # `validate` aggregates three jobs, plus `validate-docs` on a docs-only PR.
  # On PR #337 (run 39283086971) the single 60-minute FAST job was cancelled
  # by its timeout with no test failed, and S3 adds about a thousand FAST
  # tests. The operator granted sharding authority on 2026-10-20 ("Shard FAST
  # + migration-edge"); coverage reduction is still not authorized, and none is
  # made:
  #
  # - `validate-static` runs every non-pytest step of the former job exactly
  #   once (document/configuration validation, applicability, install, import
  #   smoke, ruff, mypy, governance-candidate packaging) plus the partition
  #   proof: `python -m tests.ci_shard verify` collects each sharded selection
  #   unsharded and once per shard and fails unless the shards are pairwise
  #   disjoint and their union is exactly the unsharded selection. The proof
  #   runs on every push and workflow_dispatch, and on a PR when `classify`
  #   says `shard_proof=true` (the reasoning is on the step).
  # - `validate-fast` runs the unchanged FAST `-m` expression as deterministic
  #   file-level shards (`tests/ci_shard.py`), one matrix leg per shard. The
  #   matrix size, the `/COUNT` in `CI_SHARD` and the verify step are pinned to
  #   each other by `tests/architecture/test_ci_shards.py`.
  # - `validate-docs` runs only on a docs-only PR, in place of
  #   `validate-fast`: the FAST tests of the modules that read `docs/`,
  #   top-level `*.md` or `ops/runbooks/` (the list and how it was found are
  #   on the job).
  # - `validate` is the required-check compatible aggregator, like
  #   `database-tier`: it fails unless `classify` succeeded and every needed
  #   result is exactly `success` (failure, cancelled and skipped all fail),
  #   except the docs-only cases stated on `classify`.
  #
  # Per-shard budget, measured on CI (ubuntu-latest). The `fast` weights in
  # `tests/ci_shard_weights.json` are CI per-file averages over the five
  # complete FAST legs of PR head 922db4ab (validate-fast 2,3;
  # dependency-floor-fast 1,2,3), with one exception below. Under those
  # measurements `test_every_capability_reaching_a_memory_row_is_declared.py`
  # (weight 990.9) sat alone in shard 1: it took 934-1549 s on complete legs
  # and >1715 s on the PR run 42623232044 leg cancelled at the old 35 minutes
  # (job 2116 s); main 3a1bdea7 shard 1 took 1991 s. Collection adds
  # 210-350 s per leg. These are the measurements the timeouts were sized on:
  # at 55 minutes (3300 s), 1991 s is 60%, 2116 s 64%, a ~1900 s walk + 350 s
  # collection + setup (~2285 s) 69%. Measurement headroom, not a
  # performance SLA.
  #
  # The exception: commit 1fa7b0ca5 made that file cheaper (841 s -> 41 s
  # locally). Its weight is now 48.3, an ESTIMATE, not a CI measurement:
  # 41 s x (990.9 / 841 = 1.18, the CI/local ratio of its old cost). With it,
  # the plan's three shard totals are 613.7 / 613.7 / 613.8 s of weight
  # (were 990.9 / 896.4 / 896.5), so no file bounds a shard any longer. The
  # timeouts are deliberately unchanged until CI legs measure the new plan;
  # regenerate the table with `python -m tests.ci_shard weigh` from those
  # legs' JUnit XML.
  validate-static:
    # Runs on every event, docs-only PRs included, and even when `classify`
    # failed; only the partition-proof step reads the classification.
    if: ${{ !cancelled() }}
    needs:
      - classify
    runs-on: ubuntu-latest
    # The partition proof alone took 27 minutes on CI; the job took 1684 s on
    # the PR (94% of the old 30 minutes) and 1555 s on main. 1684 s of 45
    # minutes (2700 s) is 62%. Measurement headroom, not an SLA.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository documents and configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          errors = []
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for target in link_pattern.findall(text):
                  target = target.strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = target.split("#", 1)[0]
                  if not clean:
                      continue
                  resolved = (root / clean.lstrip("/")) if clean.startswith("/") else (path.parent / clean)
                  if not resolved.resolve().exists():
                      errors.append(f"{path}: missing relative link {target}")

          required = [
              root / "AGENTS.md",
              root / "CONTRIBUTING.md",
              root / "SECURITY.md",
              root / ".github" / "pull_request_template.md",
              root / ".github" / "ISSUE_TEMPLATE" / "bounded-change.yml",
          ]
          for path in required:
              if not path.exists():
                  errors.append(f"missing required governance path: {path.relative_to(root)}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY

          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true); puts "validated #{f}" }' \
            .github/ISSUE_TEMPLATE/bounded-change.yml \
            .github/dependabot.yml

      - name: Check Python FAST applicability
        id: fast
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; governance/configuration validation is the applicable gate."
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Install Python FAST dependencies
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke-test Python FAST imports
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import tomllib
          from pathlib import Path

          from my_pa.adapters.mcp.server import _answer
          from my_pa.application.service import ApplicationService

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"package_name={project['project']['name']}")
          print(f"package_version={project['project']['version']}")
          print(
              "invoke="
              f"{ApplicationService.invoke.__module__}.{ApplicationService.invoke.__qualname__}"
          )
          print(f"invoke_file={inspect.getfile(ApplicationService)}")
          print(f"answer={_answer.__module__}.{_answer.__qualname__}")
          print(f"answer_file={inspect.getfile(_answer)}")
          PY

      - name: Lint and format-check Python FAST tier
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type-check Python FAST tier
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          # `mypy` with no path argument, deliberately: an explicit target
          # overrides `[tool.mypy] files` in `pyproject.toml`. Measured at
          # `bcdbf6d`: `mypy src` checked 93 files and a bare `mypy` checked
          # 109, so the 16 in `apps/` and `migrations/` were type-checked by
          # nothing in CI. Proven with a plant: a deliberate `-> str`
          # returning `int` in `apps/` left `mypy src` reporting "Success: no
          # issues found in 93 source files", and the same plant in
          # `migrations/env.py` did too, while a bare `mypy` caught both.
          # Both invocations are bare now, so they agree by construction
          # rather than by a number that has to be maintained. `D-64`.
          python -m mypy

      - name: Prove the CI test shards partition their selections
        # Always on push and workflow_dispatch, and on a PR unless `classify`
        # succeeded and said `shard_proof=false`. Why skipping is sound there:
        # `tests/ci_shard.py` places a test by `shard_of(path, lane, count)`,
        # a pure function of the test's *file path*, the shard count and
        # `tests/ci_shard_weights.json`, applied by a `trylast` hook after
        # selection. Editing the body of an existing `test_*.py` (or changing
        # `src/`) can change which tests a file holds but not which shard owns
        # the file, so unsharded == union of shards still holds. Every input
        # that can change the partition sets `shard_proof=true`: the selector,
        # its weights, `tests/architecture/test_ci_shards.py`, this workflow,
        # `pyproject.toml` (and any `pytest.ini`/`tox.ini`/`setup.cfg`), any
        # `conftest.py` or other non-`test_*` module under `tests/` (hooks and
        # plugins, including the auto-marking in `tests/db/fixtures.py`), a
        # test module loaded through `pytest_plugins`, and adding, deleting or
        # renaming any `*.py` under `tests/` (`--no-renames`: a rename is
        # `A`+`D`). The proof runs on every push to `main` regardless.
        if: steps.fast.outputs.applicable == 'true' && (github.event_name != 'pull_request' || needs.classify.result != 'success' || needs.classify.outputs.shard_proof != 'false')
        shell: bash
        run: |
          # Collection only: no test runs here and no database is needed to
          # collect the migration selection. Each command collects unsharded
          # and once per shard, concurrently, and compares node-ID sets.
          python -m tests.ci_shard verify --lane fast --shards 3 -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery"
          python -m tests.ci_shard verify --lane migration --shards 5 -m "migration_edge or migration"

      - name: Package governance candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-candidate-${{ github.sha }}
          path: |
            .ai/project-sources/00_AEOS_MASTER_INDEX.md
            .github/CODEOWNERS
            .github/ISSUE_TEMPLATE/bounded-change.yml
            .github/dependabot.yml
            .github/pull_request_template.md
            .github/workflows/repository-checks.yml
            AGENTS.md
            AI_OPERATING_MANUAL.md
            CLAUDE.md
            CONTRIBUTING.md
            SECURITY.md
            docs/00_REPOSITORY_SOURCE_INDEX.md
            docs/governance/GOVERNANCE-AUDIT-MYPA-MCV-20260730.md
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  validate-fast:
    # One leg per FAST shard; see the comment above `validate-static`. Each leg
    # repeats only what running pytest needs: checkout identity, the
    # applicability check (so a tree without `pyproject.toml` passes here
    # exactly as the single job did) and the install. The failure-annotation
    # ledger and `--durations=50` evidence are per leg.
    # Skipped only on a docs-only PR (see `classify`).
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true') }}
    needs:
      - classify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
          if [[ "${HEAD}" != "${INTENDED_COMMIT}" ]]; then
            echo "::error::Checked-out HEAD is not the intended commit (${HEAD} != ${INTENDED_COMMIT})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check Python FAST applicability
        id: fast
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "No pyproject.toml yet; governance/configuration validation is the applicable gate."
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Install Python FAST dependencies
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test Python FAST tier
        if: steps.fast.outputs.applicable == 'true'
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}/3
        run: |
          [[ "${GITHUB_ACTIONS-}" == true ]] || exit 1
          [[ -n "${RUNNER_TEMP-}" && "$RUNNER_TEMP" == /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || exit 1
          umask 077
          ledger_dir="$(mktemp -d "$RUNNER_TEMP/my-pa-fast-ledger.XXXXXXXX")" || exit 1
          ledger=""
          trap 'rm -f -- "$ledger"; rmdir -- "$ledger_dir"' EXIT
          ledger="$(mktemp "$ledger_dir/failures.XXXXXXXX")" || exit 1
          [[ -f "$ledger" && ! -L "$ledger" ]] || exit 1
          exec 9<"$ledger" || exit 1
          export CI_PYTEST_FAILURE_LEDGER="$ledger"
          status=0
          if python -m pytest -m "not slow and not database and not network and not connector and not evaluation and not e2e and not recovery" --ci-shard "$CI_SHARD" --ci-shard-lane fast --durations=50 9<&-; then
            :
          else
            status=$?
          fi
          unset CI_PYTEST_FAILURE_LEDGER
          ledger_invalid=0
          if validated_annotations="$(python -c '
          import os
          import re
          import sys

          try:
              os.lseek(sys.stdin.fileno(), 0, os.SEEK_SET)
          except OSError:
              raise SystemExit(1)
          data = sys.stdin.buffer.read(10 * 1024 + 1)
          pattern = re.compile(
              rb"::error title=pytest failed::phase=(setup|call|teardown|collection); "
              rb"nodeid=tests/([A-Za-z0-9_./:~-]|%[0-9A-F]{2})+"
          )
          if len(data) > 10 * 1024 or not data.isascii() or b"\x00" in data:
              raise SystemExit(1)
          if data and not data.endswith(b"\n"):
              raise SystemExit(1)
          lines = data.split(b"\n")[:-1] if data else []
          if len(lines) > 10 or any(len(line) + 1 > 1024 or not pattern.fullmatch(line) for line in lines):
              raise SystemExit(1)
          sys.stdout.buffer.write(data)
          ' <&9)"; then
            :
          else
            ledger_invalid=1
          fi
          exec 9<&-
          if (( ledger_invalid != 0 )); then
            echo "::error title=pytest failed::phase=ledger; exitstatus=1"
            if (( status == 0 )); then exit 1; fi
          elif [[ -n "$validated_annotations" ]]; then
            if (( status == 0 )); then
              echo "::error title=pytest failed::phase=ledger; exitstatus=1"
              exit 1
            fi
            printf '%s\n' "$validated_annotations"
          fi
          if (( status != 0 )); then
            echo "::error title=pytest failed::phase=process; exitstatus=${status}"
            exit "$status"
          fi

  validate-fast-xdist:
    # ADVISORY, never required (operator decision O4, 2026-11-22): the whole
    # FAST selection once, unsharded, under pytest-xdist with `--dist
    # loadfile`, so whole files stay on one worker as they do in a shard. It
    # exists to measure whether xdist is stable; the serial `validate-fast`
    # shards stay the gate until ten consecutive green runs here are recorded
    # and the operator promotes it. No aggregator and no other job needs this
    # job, so its result cannot pass or fail `validate` or any other required
    # check; `tests/architecture/test_ci_shards.py` pins that. Skipped on a
    # docs-only PR exactly as `validate-fast` is (see `classify`).
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true') }}
    needs:
      - classify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checkout identity
        shell: bash
        env:
          INTENDED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "checked_out_commit=${HEAD}"
          echo "checked_out_tree=${TREE}"
          echo "intended_commit=${INTENDED_COMMIT}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF:-}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          git log -1 --format='subject=%s'
