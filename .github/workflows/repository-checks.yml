    # `migration_edge or migration` as deterministic file-level shards
    # (`tests/ci_shard.py`, lane `migration`), one matrix leg per shard, under
    # the operator's 2026-10-20 sharding authority ("Shard FAST +
    # migration-edge"; no coverage reduction). The single 60-minute job was
    # cancelled by its timeout on PR #337 with no test failed. Each leg has its
    # own throwaway PostgreSQL service, so legs share no database state. The
    # partition proof for this selection runs in `validate-static`.
