# Alembic configuration for the canonical `my_pa` PostgreSQL database.
#
#   .venv/bin/alembic upgrade head      apply every revision
#   .venv/bin/alembic downgrade base    return to an empty database
#   .venv/bin/alembic upgrade head --sql  emit SQL without connecting (offline)
#
# There is deliberately no `sqlalchemy.url` key. `migrations/env.py` takes the
# URL from MY_PA_DATABASE_URL through the process settings, so no credential can
# reach the repository and a migration cannot silently target a different server
# than the application does.

[alembic]
# `%(here)s` so the revisions are found from any working directory, including
# when the tests drive Alembic in process.
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
