# Inert, non-secret template for operator-gated authentication commissioning.
# This example records no runtime result and can never establish PASS_VERIFIED.
# Copy it outside Git only after separate operator authorization. Never record
# grants, recovery codes, cookies, challenges, credential IDs, or credentials.

schema = "my-pa.auth-runtime-evidence.v1"
status = "NOT_PERFORMED_OPERATOR_GATED"
repository_commit = "REQUIRED_FULL_COMMIT_SHA"
repository_tree = "REQUIRED_FULL_TREE_SHA"
reviewed_commit = "REQUIRED_FULL_COMMIT_SHA"
reviewed_tree = "REQUIRED_FULL_TREE_SHA"
migration_head = "REQUIRED_ALEMBIC_REVISION"
deployment_manifest_sha256 = "REQUIRED_64_HEX"
deployed_at = "REQUIRED_RFC3339_UTC"
validated_at = "REQUIRED_RFC3339_UTC"
canonical_origin = "https://pa.bobby-fetting.me"
webauthn_rp_id = "pa.bobby-fetting.me"

[device]
kind = "REQUIRED_PHYSICAL_DEVICE_KIND"
platform = "REQUIRED_PLATFORM"
os_version = "REQUIRED_OS_VERSION"
browser = "REQUIRED_BROWSER"
browser_version = "REQUIRED_BROWSER_VERSION"
installed_pwa = false

[rollback]
status = "NOT_PERFORMED_OPERATOR_GATED"
evidence_sha256 = "REQUIRED_64_HEX"
validated_at = "REQUIRED_RFC3339_UTC"

[[case]]
id = "bootstrap"
status = "NOT_PERFORMED_OPERATOR_GATED"
evidence_sha256 = "REQUIRED_64_HEX"
executed_at = "REQUIRED_RFC3339_UTC"
notes = "Operator-gated; not executed."

