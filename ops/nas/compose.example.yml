# NAS-01 contract example only. The profile is deliberately disabled by default.
# NAS-02 through NAS-09 must replace required values and add verified lifecycle
# behavior before this can become an executable smoke stack.
name: my-pa-nas-contract

services:
  postgres:
    profiles: [nas-01-contract-only]
    image: "${MY_PA_POSTGRES_IMAGE_ID:?sha256 loaded image id required}"
    platform: linux/amd64
    restart: "no"
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: my_pa
      POSTGRES_USER: my_pa
      POSTGRES_PASSWORD: "${MY_PA_DB_PASSWORD:?database password required}"
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - type: bind
        source: "${MY_PA_NAS_ROOT:?explicit NAS root required}/postgres/data"
        target: /var/lib/postgresql/data
    networks: [data-plane]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U my_pa -d my_pa"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Numeric tuning and shm_size are intentionally absent. NAS-03 may add
    # them only after postgres-resources.example.toml is replaced by verified
    # measurements from the exact live NAS Docker engine.

  gateway:
    profiles: [nas-01-contract-only]
    image: "${MY_PA_APP_IMAGE_ID:?sha256 loaded image id required}"
    platform: linux/amd64
    user: "${MY_PA_UID:?dedicated service uid required}:${MY_PA_GID:?dedicated service gid required}"
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: [python, apps/gateway.py, run]
    # NAS-04 must implement and verify this container-namespace bind setting.
    # It does not publish the gateway on the NAS host.
    environment:
      MY_PA_GATEWAY_BIND_MODE: container
      MY_PA_MANAGED_DOCUMENT_ROOT: /srv/my-pa/managed-documents
      MY_PA_AUTH_MODE: entra
      MY_PA_REMOTE_INGRESS_ENABLED: "true"
    env_file: ["${MY_PA_NAS_ENV_FILE:?owner-only NAS env file required}"]
    expose: ["8765"]
    volumes:
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/config", target: /srv/my-pa/config, read_only: true}
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/managed-documents", target: /srv/my-pa/managed-documents}
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/sources", target: /srv/my-pa/sources, read_only: true}
    networks: [data-plane, ingress-plane, entra-egress]

  worker-enrollment:
    profiles: [nas-01-contract-only]
    image: "${MY_PA_APP_IMAGE_ID:?sha256 loaded image id required}"
    platform: linux/amd64
    user: "${MY_PA_UID:?}:${MY_PA_GID:?}"
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: [python, apps/worker.py, run, --plane, enrollment]
    env_file: ["${MY_PA_NAS_ENV_FILE:?}"]
    volumes:
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/config", target: /srv/my-pa/config, read_only: true}
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/sources", target: /srv/my-pa/sources, read_only: true}
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/goodnotes", target: /srv/my-pa/goodnotes, read_only: true}
    networks: [data-plane]

  worker-capture:
    profiles: [nas-01-contract-only]
    image: "${MY_PA_APP_IMAGE_ID:?sha256 loaded image id required}"
    platform: linux/amd64
    user: "${MY_PA_UID:?}:${MY_PA_GID:?}"
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: [python, apps/worker.py, run, --plane, capture]
    env_file: ["${MY_PA_NAS_ENV_FILE:?}"]
    volumes:
      - {type: bind, source: "${MY_PA_NAS_ROOT:?}/config", target: /srv/my-pa/config, read_only: true}
    networks: [data-plane]

  web:
    profiles: [nas-01-contract-only]
    image: "${MY_PA_WEB_IMAGE_ID:?sha256 loaded image id required}"
    platform: linux/amd64
    user: "${MY_PA_UID:?}:${MY_PA_GID:?}"
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: [node, server.js]
    env_file: ["${MY_PA_WEB_ENV_FILE:?owner-only web env file required}"]
    environment:
      NODE_ENV: production
      MYPA_AUTH_MODE: entra
      MYPA_GATEWAY_URL: http://gateway:8765
      MYPA_GATEWAY_AUTH_MODE: entra
      MYPA_CANONICAL_ORIGIN: "${MYPA_CANONICAL_ORIGIN:?exact private HTTPS origin required}"
      MYPA_ENTRA_REDIRECT_URI: "${MYPA_ENTRA_REDIRECT_URI:?exact callback required}"
    expose: ["3000"]
    networks: [ingress-plane, entra-egress]

  proxy:
    profiles: [nas-01-contract-only]
    image: "${MY_PA_PROXY_IMAGE:?repository required}@${MY_PA_PROXY_IMAGE_DIGEST:?sha256 digest required}"
    platform: linux/amd64
    user: "${MY_PA_PROXY_UID:?verified proxy uid required}:${MY_PA_PROXY_GID:?verified proxy gid required}"
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      MY_PA_TAILNET_HOST: "${MY_PA_TAILNET_HOST:?exact verified tailnet hostname required}"
    ports:
      - "127.0.0.1:${MY_PA_PROXY_PORT:?explicit smoke port required}:8080"
    volumes:
      - {type: bind, source: "./proxy-allowlist.example.caddy", target: /etc/caddy/Caddyfile, read_only: true}
    tmpfs:
      - /config
      - /data
    networks: [ingress-plane]

networks:
  data-plane:
    internal: true
  ingress-plane:
    internal: true
  # Only gateway and web join this plane. Live activation additionally requires
  # a verified host/DNS firewall allowlist for the measured Entra endpoints.
  entra-egress:
    internal: false
