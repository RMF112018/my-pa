# Files workspace plane (ADR-019, files-workspace contract section 9) for the gateway.
# Used WITH ops/nas/compose.example.yml (+ compose.public-browser.example.yml and the
# live overlays already in the container's com.docker.compose.project.config_files label),
# project my-pa-nas-contract. Runbook: ops/runbooks/files-workspace.md. Not a secret.
# The host subtree is the one NAS folder admitted as the workspace, never /volume1 or
# /volume1/homes; the gateway's MY_PA_UID needs read-write ACL on it first (runbook step 2).
services:
  gateway:
    environment:
      MY_PA_FILES_WORKSPACE_ROOT: /srv/my-pa/workspaces/mcp
      MY_PA_FILES_WORKSPACE_ID: mcp
      MY_PA_FILES_MAX_UPLOAD_BYTES: "10737418240"
      MY_PA_FILES_DISK_RESERVE_BYTES: "21474836480"
    volumes:
      - type: bind
        source: /volume1/homes/bfetting/MCP
        target: /srv/my-pa/workspaces/mcp
        read_only: false
