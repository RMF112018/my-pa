[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-pa"
version = "0.1.0"
description = "Personal Knowledge Layer contracts, policy, identity, and audit kernel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "RMF" }]
keywords = ["knowledge", "contracts", "policy", "audit"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# Every runtime dependency is pinned to a compatible range: a floor at the
# oldest release whose behaviour this code relies on, and a ceiling at the next
# major, because each of these projects reserves breaking changes for majors.
# The `dependency-floor` CI job installs the declared floor and runs the suite
# against it, so the lower bound is a checked claim rather than a wish.
#
#   pydantic          contract and settings validation.
#   SQLAlchemy        Core engine, connection pool, and dialect. The floor is
#                     2.0.20, not 2.0: `sqlalchemy.dialects.postgresql.insert`
#                     was untyped (`def insert(table):`) through 2.0.10 and only
#                     gained `-> Insert` by 2.0.20, so the three `pg_insert`
#                     call sites in the migration control plane fail mypy's
#                     `no-untyped-call` against anything older. The floor job
#                     caught this; bisected against the 2.0.0/2.0.10/2.0.20
#                     wheels. Removal path: raw psycopg.
#   psycopg[binary]   the PostgreSQL driver SQLAlchemy's `postgresql+psycopg`
#                     dialect requires. 3.2 is the floor for the current
#                     `psycopg.rows`/pipeline behaviour. `[binary]` ships a
#                     wheel with libpq bundled, so no local PostgreSQL client
#                     build is needed. Security surface: it speaks the wire
#                     protocol to a local container only.
#   alembic           schema migrations, required by AGENTS.md section 6.
#                     1.13 is the floor for the current `op`/`context` API.
#                     Removal path: hand-run SQL files, which would lose the
#                     empty-to-head and head-to-empty guarantee.
dependencies = [
  "pydantic>=2.7,<3",
  "SQLAlchemy>=2.0.20,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_pa = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",   # builtin shadowing
  "ANN", # missing annotations
  "B",   # bugbear
  "C4",  # comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "N",   # naming
  "PTH", # prefer pathlib
  "RUF", # ruff rules
  "S",   # bandit
  "SIM", # simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the point of a test

[tool.mypy]
# Explicit targets so a bare `mypy` checks the same tree CI does, plus the
# Alembic environment and revisions and the operator CLI, which are executable
# code outside `src`.
files = ["src", "migrations", "apps"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "slow: excluded from the FAST tier",
  "database: requires a reachable PostgreSQL server",
  "network: requires network access; not part of Phase 01",
  "connector: requires a personal-data connector; not part of Phase 01",
  "evaluation: quality evaluation suite; not part of Phase 01",
  "e2e: end-to-end suite; not part of Phase 01",
  "recovery: recovery suite; not part of Phase 01",
]
