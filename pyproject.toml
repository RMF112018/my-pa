[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-pa"
version = "0.1.0"
description = "Personal Knowledge Layer contracts, policy, identity, and audit kernel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "RMF" }]
keywords = ["knowledge", "contracts", "policy", "audit"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# Every runtime dependency is pinned to a compatible range: a floor at the
# oldest release whose behaviour this code relies on, and a ceiling at the next
# major, because each of these projects reserves breaking changes for majors.
# The `dependency-floor` CI job installs the declared floor and runs the suite
# against it, so the lower bound is a checked claim rather than a wish.
#
#   pydantic          contract and settings validation. The floor was 2.7 and is
#                     now 2.12, and the reason is not a behaviour this code
#                     needs: `mcp` 2.0.0's own metadata declares
#                     `pydantic>=2.12.0`, so a build installing the declared
#                     minimum of both is a build `pip check` reports as broken.
#                     The floor job runs exactly that check, so leaving 2.7
#                     declared would have been declaring a minimum that does not
#                     resolve. Raised to the number the dependency graph
#                     actually requires rather than to a round one.
#   SQLAlchemy        Core engine, connection pool, and dialect. The floor is
#                     2.0.32: this project declares mypy>=1.11, and SQLAlchemy
#                     2.0.32 is the first release whose internal typing was
#                     made compatible with mypy 1.11. The Work read plane also
#                     relies on typed Core function, case, label, ordering, and
#                     row expressions, so 2.0.20's earlier typing surface is no
#                     longer an honest checked floor. This remains above the
#                     prior 2.0.20 floor where PostgreSQL `insert` gained its
#                     typed return. Removal path: raw psycopg.
#   psycopg[binary]   the PostgreSQL driver SQLAlchemy's `postgresql+psycopg`
#                     dialect requires. 3.2 is the floor for the current
#                     `psycopg.rows`/pipeline behaviour. `[binary]` ships a
#                     wheel with libpq bundled, so no local PostgreSQL client
#                     build is needed. Security surface: it speaks the wire
#                     protocol to a local container only.
#   alembic           schema migrations, required by AGENTS.md section 6.
#                     1.13 is the floor for the current `op`/`context` API.
#                     Removal path: hand-run SQL files, which would lose the
#                     empty-to-head and head-to-empty guarantee.
#   starlette         routing, the request and response objects, and the
#                     `HTTPException` handler — nothing else (`D-25`; not
#                     FastAPI, which would add a second validation layer that
#                     the MCP adapter has no counterpart for). Used only by
#                     `adapters/http`, which `tests/architecture` confines.
#                     The floor is **not** derived from behaviour, and saying so
#                     is the honest form: the suite was run against 0.36, 0.35,
#                     0.32, 0.28, 0.26.1, 0.22 and 0.20 and passed on every one,
#                     because `Route`, `Request`, `Response`, `ClientDisconnect`
#                     and class-keyed exception handlers have been stable for
#                     years. So the floor is derived from the *interpreter*
#                     instead: `requires-python` here is 3.12, and 0.31.0 is the
#                     first Starlette whose metadata declares Python 3.12 —
#                     0.30.0 declares 3.8 through 3.11. Below it the project
#                     would be running on an interpreter Starlette never tested
#                     against, which is a floor with a reason rather than a
#                     round number. Maintenance cost: a small ASGI toolkit with
#                     one transitive dependency (`anyio`) and no framework
#                     behind it. Security surface: it parses a request line and
#                     headers on a loopback-only socket; it handles no
#                     credential, no TLS, and no multipart, since this transport
#                     reads `application/json` and nothing else. Removal path: a
#                     hand-written ASGI application, which would mean owning
#                     header parsing and response encoding for no gain.
#   uvicorn           the ASGI server that runs it. Imported only by
#                     `apps/gateway.py`, never by the package — running a server
#                     is a composition root's act, and the architecture tests
#                     keep it out of `src/`. The floor is 0.29, not 0.30 and not
#                     0.27, and it is behavioural: `Server.capture_signals`
#                     re-raises the signal it captured once it has shut down
#                     gracefully, so a gateway stopped by `SIGTERM` exits *by*
#                     `SIGTERM`. At 0.27.0 and 0.28.0 it returns and the process
#                     exits `0`, which reports a signalled stop as a normal one.
#                     Bisected against the 0.27.0/0.28.0/0.29.0 wheels; the
#                     assertion that found it is in
#                     `tests/contract/test_http_gateway_process.py`. Security
#                     surface: it binds one loopback socket. Removal path: any
#                     other ASGI server, since nothing in the transport depends
#                     on this one.
#                     **The declared floor is 0.31.1, not 0.29, and the reason
#                     is no longer this transport's.** WP-4B2b added `mcp`,
#                     whose own metadata declares `uvicorn>=0.31.1` for every
#                     platform this repository runs on, so `0.29` and `mcp 2.0`
#                     do not resolve together — the `dependency-floor` job fails
#                     `ResolutionImpossible` before it installs anything.
#                     Observed while building the floor environment for this
#                     change. The behavioural derivation above is unchanged and
#                     still holds: 0.31.1 is above 0.29, so the signal
#                     re-raise this build depends on is present. What changed is
#                     which constraint binds.
#   mcp               the official Model Context Protocol SDK: JSON-RPC framing,
#                     the `initialize` handshake and protocol-version
#                     negotiation, `tools/list`, `tools/call`, and the stdio
#                     transport (`D-26`; stdio only, `D-30`). Used only by
#                     `adapters/mcp`, which `tests/architecture` confines the
#                     way it confines Starlette. `AGENTS.md` section 2 admits it
#                     because conformance to a specification this repository
#                     does not own is what the standard library cannot
#                     reasonably do: hand-rolling the framing and the handshake
#                     risks drifting from the spec silently, and a client is the
#                     only thing that would notice.
#                     The floor is 2.0, and it is derived from the API this
#                     adapter uses rather than from a release date.
#                     `create_mcp_server` registers its handlers through
#                     `Server(name, on_list_tools=..., on_call_tool=...)`, which
#                     is 2.0's constructor-based registration; 1.29.0 — the last
#                     1.x — has no such keyword and offers only the decorator
#                     form, so the adapter raises `TypeError` at composition
#                     against anything older. Read off the 1.29.0 and 2.0.0
#                     wheels' own `mcp/server/lowlevel/server.py`, and confirmed
#                     by installing 1.29.0 and importing the adapter.
#                     Maintenance cost is the honest problem with this one and
#                     is stated rather than smoothed over: the SDK's own
#                     requirements pull in an HTTP client, `cryptography`,
#                     `pyjwt`, `jsonschema`, `python-multipart`, `sse-starlette`
#                     and an OpenTelemetry API, none of which this transport
#                     uses, because they serve the OAuth and streamable-HTTP
#                     surfaces `D-30` refuses. There is no extra that omits
#                     them. **They are prohibited from being imported, and that
#                     prohibition is now derived rather than typed.** The first
#                     version of this comment claimed the enforcement while the
#                     guard enforced none of it — an independent review imported
#                     all six into `application/service.py` with the whole FAST
#                     tier green, because not one root was on the hand-written
#                     list and the entry meant to cover the HTTP client named
#                     `httpx` while `mcp` 2.0 declares `httpx2`.
#                     `tests/architecture/test_scope_and_hygiene.py` now walks
#                     `mcp`'s declared requirement closure, extras included, and
#                     maps each distribution to the import names it installs, so
#                     a future release cannot add a package nobody thought to
#                     type here. Security surface: what this build *runs* is the
#                     JSON-RPC framing over a pipe — no socket is opened, no
#                     credential is read, and the network transports are never
#                     imported. Removal path: a hand-written JSON-RPC loop over
#                     stdio, which would mean owning protocol conformance for a
#                     specification that changes without us.
#   PyJWT[crypto]     RS256 verification of the Entra bearer tokens
#                     `MY_PA_AUTH_MODE=entra` requires, confined to
#                     `infrastructure/security/entra_token.py` the way Starlette
#                     is confined to the transport. The standard library has no
#                     JWS implementation, and the defects a hand-written one
#                     ships with are the alg-confusion family — a token
#                     declaring `alg: none`, or an HS256 token signed with the
#                     RSA public key the verifier publishes — which look like
#                     working code until someone tries them. Floor at 2.10.1
#                     because that is what `mcp` already declares, so the two
#                     resolve together and the `dependency-floor` job installs
#                     one version rather than a conflict; ceiling at the next
#                     major. The `crypto` extra is what supplies `cryptography`,
#                     without which RS256 is unavailable and only HMAC works.
#                     Maintenance cost is already paid: the distribution is
#                     installed in every environment today, transitively through
#                     `mcp`, and declaring it directly is what stops a resolver
#                     dropping it silently. Security surface: it parses and
#                     verifies a token this process was handed, and
#                     `jwt.PyJWKClient` fetches the issuer's published keys over
#                     `urllib` from the configured URL and from nothing else.
#                     Removal path: a hand-written JWS verifier over
#                     `cryptography`, which is installed for the same reason —
#                     that would mean owning the algorithm allowlist, the key
#                     selection, and the clock arithmetic, which is exactly where
#                     this class of defect lives.
#   pypdfium2         pinned pdfium rasterizer for GoodNotes visual page identity.
#                     Current use: render admitted PDF (and JPEG-wrapped) pages
#                     to grayscale bitmaps so durable-note lineage can hash
#                     visible content instead of raw PDF object bytes. The
#                     standard library cannot rasterize PDF. Not pypdf and not
#                     fitz/PyMuPDF, which architecture tests prohibit. Pillow is
#                     not used: grayscale normalize and dHash run over packed
#                     pixel bytes in this repository. Floor 5.0 is the 5.x
#                     `PYPDFIUM_INFO`/`PDFIUM_INFO` metadata this profile records
#                     on `PageRender`; ceiling at the next major. Maintenance
#                     cost: one wheel that vendors pdfium. Security surface: it
#                     parses admitted local PDF/JPEG bytes already bounded by the
#                     GoodNotes source reader; it opens no socket and reads no
#                     credential. Removal path: another pdfium binding, or drop
#                     visual identity and revert to the explicit legacy
#                     raw-representation profile.
dependencies = [
  "pydantic>=2.12,<3",
  "PyJWT[crypto]>=2.10.1,<3",
  "SQLAlchemy>=2.0.32,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "starlette>=0.31,<1",
  "uvicorn>=0.31.1,<1",
  "mcp>=2.0,<3",
  "pypdfium2>=5.0,<6",
  "webauthn>=2.8,<3",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_pa = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",   # builtin shadowing
  "ANN", # missing annotations
  "B",   # bugbear
  "C4",  # comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "N",   # naming
  "PTH", # prefer pathlib
  "RUF", # ruff rules
  "S",   # bandit
  "SIM", # simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the point of a test

[tool.mypy]
# Explicit targets: the package, plus the Alembic environment and revisions and
# the operator CLI, which are executable code outside `src`.
#
# **This is now what CI runs, and until `D-64` it was not.** Both workflow jobs
# invoked `mypy src`, and an explicit path argument *overrides* this list — so
# at `bcdbf6d` CI checked 93 files while a bare `mypy` checked 109, leaving the
# 16 in `apps/` and `migrations/` type-checked by nothing. The first version of
# this comment claimed the opposite ("so a bare `mypy` checks the same tree CI
# does"), which was false when written. Both invocations are bare now, so the
# two agree by construction rather than by a number anyone has to maintain.
files = ["src", "migrations", "apps", "ops"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so `from tests.conftest import ...` resolves whichever way
# pytest was started. `python -m pytest` puts the working directory on `sys.path`
# and the `pytest` console script does not, so without this the two invocations
# disagree: one collects and one fails. `docs/migration/PHASE-01-FOUNDATION.md`
# documents the console-script form. The test root preserves legacy synthetic
# helper imports such as `from wire import ...`; `tests/__init__.py` ensures an
# unrelated installed package cannot shadow repository fixtures.
pythonpath = ["src", ".", "tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "slow: excluded from the FAST tier",
  "database: requires a reachable PostgreSQL server",
  "network: requires network access; not part of Phase 01",
  "connector: requires a personal-data connector; not part of Phase 01",
  "evaluation: quality evaluation suite; not part of Phase 01",
  # `e2e` and `recovery` said "not part of Phase 01" until WP-4B3, when both
  # acquired their first tests. Neither is excluded from CI: split database-tier
  # lanes select them directly (`D-46`, premise corrected by `D-53`), and the
  # two FAST jobs still deselect all three plus the narrower provisioning
  # markers that ride those tests.
  "e2e: end-to-end suite; runs in the database-e2e job, not in FAST",
  "recovery: recovery suite; runs in the database-recovery job, not in FAST",
  "database_clone: current-schema test using a hard PostgreSQL clone",
  "database_transactional: current-schema test using transaction rollback isolation",
  "migration: migration-contract test; not ordinary current-schema provisioning",
  "migration_edge: bounded revision upgrade/downgrade or data-contract test",
  "migration_empty_to_head: empty database upgraded to the current Alembic head",
  "migration_historical: historical compatibility retained outside the default PR database job",
]
